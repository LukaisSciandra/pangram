<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spelling Bee Pangram Solver</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-inner">
        <div class="logo">&#9041;</div>
        <h1>Pangram Solver</h1>
        <p class="subtitle">Find words that use all 7 letters at least once</p>
      </div>
    </header>

    <main class="main">
      <section class="input-section card">
        <h2>Enter Your 7 Letters</h2>
        <p class="hint">Type exactly 7 unique letters (no repeats)</p>

        <div class="letter-row" id="letter-row">
          <input class="letter-box" maxlength="1" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Letter 1" />
          <input class="letter-box" maxlength="1" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Letter 2" />
          <input class="letter-box" maxlength="1" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Letter 3" />
          <input class="letter-box" maxlength="1" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Letter 4" />
          <input class="letter-box" maxlength="1" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Letter 5" />
          <input class="letter-box" maxlength="1" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Letter 6" />
          <input class="letter-box" maxlength="1" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Letter 7" />
        </div>

        <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>

        <div class="btn-row">
          <button class="btn-solve" id="btn-solve" disabled>Find Pangrams</button>
          <button class="btn-clear" id="btn-clear">Clear</button>
        </div>
      </section>

      <section class="results-section" id="results-section" hidden>
        <div class="results-header">
          <h2>Results</h2>
          <span class="results-count" id="results-count"></span>
        </div>
        <div class="results-letters" id="results-letters"></div>
        <div class="word-grid" id="word-grid"></div>
      </section>

      <section class="no-results-section" id="no-results-section" hidden>
        <div class="card no-results-card">
          <div class="no-results-icon">&#8709;</div>
          <p>No pangrams found for these letters.</p>
          <p class="no-results-hint">Try a different combination.</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Word list: common English non-proper nouns of 7+ letters.</p>
    </footer>
  </div>

  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <p>Loading word list&hellip;</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
